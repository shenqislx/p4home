name: Firmware Self-Hosted Flash Serial

on:
  workflow_dispatch:
    inputs:
      validation_profile:
        description: Hardware validation profile
        required: true
        type: choice
        options:
          - generic
          - phase2d_agent
          - phase3d_object
          - phase4c_ha
          - phase5a_voice
          - phase5b_voice
          - phase5c_stt
          - phase5e_e2e
          - phase5e_ui
          - phase6h_cat_memory
          - phase7_autonomy
          - product_human
        default: generic
      serial_port:
        description: macOS serial device path
        required: true
        default: /dev/cu.usbserial-210
      monitor_seconds:
        description: Serial capture duration in seconds (10-7200)
        required: true
        default: "120"
      agent_host:
        description: Runner LAN host reachable by P4 (Agent profiles only)
        required: false
        default: ""
      agent_port:
        description: Temporary Agent TLS port (Agent profiles only)
        required: true
        default: "8443"

permissions:
  contents: read

concurrency:
  group: p4home-esp32p4-hardware
  cancel-in-progress: false

jobs:
  flash-and-monitor:
    name: Flash ESP32-P4 and capture serial logs
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - esp32-p4
    timeout-minutes: 150
    defaults:
      run:
        shell: zsh -l {0}
    env:
      SERIAL_PORT: ${{ inputs.serial_port }}
      MONITOR_SECONDS: ${{ inputs.monitor_seconds }}
      VALIDATION_PROFILE: ${{ inputs.validation_profile }}
      AGENT_HOST: ${{ inputs.agent_host }}
      AGENT_PORT: ${{ inputs.agent_port }}
      IDF_SKIP_CHECK_SUBMODULES: "1"
      FLASH_BAUD: "115200"

    steps:
      - name: Checkout repository archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_WORKSPACE="$RUNNER_WORKSPACE/${GITHUB_REPOSITORY#*/}"
          test "$GITHUB_WORKSPACE" = "$EXPECTED_WORKSPACE"
          P4HOME_SOURCE_ARCHIVE="$RUNNER_TEMP/p4home-$GITHUB_SHA.tar.gz"
          echo "P4HOME_SOURCE_ARCHIVE=$P4HOME_SOURCE_ARCHIVE" >> "$GITHUB_ENV"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 300 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" \
            --output "$P4HOME_SOURCE_ARCHIVE"
          tar -tzf "$P4HOME_SOURCE_ARCHIVE" > /dev/null
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          tar -xzf "$P4HOME_SOURCE_ARCHIVE" --strip-components=1 -C "$GITHUB_WORKSPACE"
          test -f .github/workflows/firmware-self-hosted-flash-serial.yml

      - name: Validate runner and inputs
        run: |
          set -euo pipefail
          test -c "$SERIAL_PORT"
          python3 - <<'PY'
          import os
          import re

          seconds = int(os.environ["MONITOR_SECONDS"])
          if not 10 <= seconds <= 7200:
              raise SystemExit("monitor_seconds must be between 10 and 7200")
          profile = os.environ["VALIDATION_PROFILE"]
          if profile not in {"generic", "phase2d_agent", "phase3d_object", "phase4c_ha", "phase5a_voice", "phase5b_voice", "phase5c_stt", "phase5e_e2e", "phase5e_ui", "phase6h_cat_memory", "phase7_autonomy", "product_human"}:
              raise SystemExit("unsupported validation_profile")
          port = int(os.environ["AGENT_PORT"])
          if not 1 <= port <= 65535:
              raise SystemExit("agent_port must be between 1 and 65535")
          if profile in {"phase2d_agent", "phase3d_object", "phase5b_voice", "phase5c_stt", "phase5e_e2e", "phase5e_ui", "phase6h_cat_memory", "phase7_autonomy", "product_human"}:
              host = os.environ["AGENT_HOST"]
              if not host or re.fullmatch(r"[A-Za-z0-9.-]+", host) is None:
                  raise SystemExit("Agent profiles require a safe runner LAN agent_host")
          if profile == "phase2d_agent":
              if seconds != 7200:
                  raise SystemExit("phase2d_agent requires monitor_seconds=7200")
          if profile == "phase3d_object" and seconds < 120:
              raise SystemExit("phase3d_object requires monitor_seconds>=120")
          if profile == "phase6h_cat_memory" and seconds < 120:
              raise SystemExit("phase6h_cat_memory requires monitor_seconds>=120")
          if profile == "phase7_autonomy" and seconds < 300:
              raise SystemExit("phase7_autonomy requires monitor_seconds>=300")
          if profile == "phase4c_ha" and seconds < 120:
              raise SystemExit("phase4c_ha requires monitor_seconds>=120")
          if profile == "phase5a_voice" and seconds < 180:
              raise SystemExit("phase5a_voice requires monitor_seconds>=180")
          if profile == "phase5b_voice" and seconds < 180:
              raise SystemExit("phase5b_voice requires monitor_seconds>=180")
          if profile == "product_human" and seconds < 180:
              raise SystemExit("product_human requires monitor_seconds>=180")
          if profile == "phase5c_stt" and seconds < 300:
              raise SystemExit("phase5c_stt requires monitor_seconds>=300")
          if profile == "phase5e_e2e" and seconds < 600:
              raise SystemExit("phase5e_e2e requires monitor_seconds>=600")
          if profile == "phase5e_ui" and seconds < 900:
              raise SystemExit("phase5e_ui requires monitor_seconds>=900")
          PY
          test -f scripts/activate-idf-v5.5.4.sh
          test -s firmware/dependencies.lock
          test -f "$HOME/.espressif/tools/activate_idf_v5.5.4.sh"
          test "$FLASH_BAUD" = "115200"
          echo "DEPENDENCY_LOCK_SHA256_BEFORE=$(shasum -a 256 firmware/dependencies.lock | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$RUNNER_TEMP/p4home-hardware-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "SIZE_REPORT=$RUNNER_TEMP/p4home-size-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" >> "$GITHUB_ENV"
          echo "AGENT_TMP_DIR=$RUNNER_TEMP/p4home-agent-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "TRANSPORT_STATUS_FILE=$RUNNER_TEMP/p4home-transport-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.status" >> "$GITHUB_ENV"
          if [[ "$VALIDATION_PROFILE" == "phase2d_agent" ]]; then
            echo "CAPTURE_SECONDS=$((MONITOR_SECONDS + 300))" >> "$GITHUB_ENV"
          elif [[ "$VALIDATION_PROFILE" == "phase7_autonomy" ]]; then
            # The Phase 7 harness has a 20-minute hard deadline. Capture may
            # finish early only after 35 seconds of post-terminal P4 metrics.
            echo "CAPTURE_SECONDS=1235" >> "$GITHUB_ENV"
          elif [[ "$VALIDATION_PROFILE" == "phase3d_object" || \
                  "$VALIDATION_PROFILE" == "phase6h_cat_memory" ]]; then
            echo "CAPTURE_SECONDS=$((MONITOR_SECONDS + 120))" >> "$GITHUB_ENV"
          elif [[ "$VALIDATION_PROFILE" == "phase4c_ha" ]]; then
            echo "CAPTURE_SECONDS=$((MONITOR_SECONDS + 180))" >> "$GITHUB_ENV"
          elif [[ "$VALIDATION_PROFILE" == "phase5b_voice" || \
                  "$VALIDATION_PROFILE" == "phase5c_stt" || \
                  "$VALIDATION_PROFILE" == "phase5e_e2e" || \
                  "$VALIDATION_PROFILE" == "phase5e_ui" ]]; then
            echo "CAPTURE_SECONDS=$((MONITOR_SECONDS + 180))" >> "$GITHUB_ENV"
          else
            echo "CAPTURE_SECONDS=$MONITOR_SECONDS" >> "$GITHUB_ENV"
          fi
          if [[ "$VALIDATION_PROFILE" == "phase3d_object" || \
                "$VALIDATION_PROFILE" == "phase6h_cat_memory" || \
                "$VALIDATION_PROFILE" == "phase7_autonomy" ]]; then
            echo "AGENT_PROTOCOL_VERSION=2" >> "$GITHUB_ENV"
          else
            echo "AGENT_PROTOCOL_VERSION=1" >> "$GITHUB_ENV"
          fi

      - name: Validate agent harness helpers
        run: python3 -m unittest discover -s tests/harness -p 'test_*.py' -v

      - name: Prepare private hardware sdkconfig
        env:
          SDKCONFIG_B64: ${{ secrets.P4HOME_HARDWARE_SDKCONFIG_B64 }}
        run: |
          set -euo pipefail
          export PRIVATE_HARDWARE_SDKCONFIG="$RUNNER_TEMP/p4home-private-hardware-sdkconfig"
          export HARDWARE_SDKCONFIG="$RUNNER_TEMP/p4home-hardware-sdkconfig"
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import shutil

          destination = pathlib.Path(os.environ["PRIVATE_HARDWARE_SDKCONFIG"])
          encoded = os.environ.get("SDKCONFIG_B64", "").strip()
          fallback = pathlib.Path.home() / ".config" / "p4home" / "sdkconfig.hardware"

          if encoded:
              destination.write_bytes(base64.b64decode(encoded, validate=True))
          elif fallback.is_file():
              shutil.copyfile(fallback, destination)
          else:
              raise SystemExit(
                  "Missing P4HOME_HARDWARE_SDKCONFIG_B64 and "
                  "~/.config/p4home/sdkconfig.hardware"
              )
          destination.chmod(0o600)
          PY
          python3 scripts/merge-sdkconfig-defaults.py \
            --base "$PRIVATE_HARDWARE_SDKCONFIG" \
            --defaults firmware/sdkconfig.defaults \
            --output "$HARDWARE_SDKCONFIG"
          EXPECTED_MAIN_TASK_STACK_SIZE="$(sed -n 's/^CONFIG_ESP_MAIN_TASK_STACK_SIZE=//p' firmware/sdkconfig.defaults)"
          test -n "$EXPECTED_MAIN_TASK_STACK_SIZE"
          grep -qx "CONFIG_ESP_MAIN_TASK_STACK_SIZE=$EXPECTED_MAIN_TASK_STACK_SIZE" "$HARDWARE_SDKCONFIG"
          echo "HARDWARE_SDKCONFIG=$HARDWARE_SDKCONFIG" >> "$GITHUB_ENV"
          echo "EXPECTED_MAIN_TASK_STACK_SIZE=$EXPECTED_MAIN_TASK_STACK_SIZE" >> "$GITHUB_ENV"
          if [[ "${{ inputs.validation_profile }}" != "generic" ]]; then
            EXPECTED_AGENT_TASK_STACK_SIZE="$(sed -n 's/^CONFIG_P4HOME_AGENT_TRANSPORT_TASK_STACK=//p' firmware/sdkconfig.defaults)"
            test -n "$EXPECTED_AGENT_TASK_STACK_SIZE"
            grep -qx "CONFIG_P4HOME_AGENT_TRANSPORT_TASK_STACK=$EXPECTED_AGENT_TASK_STACK_SIZE" "$HARDWARE_SDKCONFIG"
            echo "EXPECTED_AGENT_TASK_STACK_SIZE=$EXPECTED_AGENT_TASK_STACK_SIZE" >> "$GITHUB_ENV"
          fi

      - name: Prepare Phase 5A voice profile
        if: inputs.validation_profile == 'phase5a_voice'
        run: |
          set -euo pipefail
          python3 scripts/prepare-phase5a-voice-profile.py --sdkconfig "$HARDWARE_SDKCONFIG"
          grep -qx "CONFIG_ESP_MAIN_TASK_STACK_SIZE=12288" "$HARDWARE_SDKCONFIG"
          grep -qx "CONFIG_P4HOME_SR_ENABLE=y" "$HARDWARE_SDKCONFIG"
          grep -qx "CONFIG_P4HOME_AUDIO_STARTUP_SELFTEST=y" "$HARDWARE_SDKCONFIG"
          grep -qx "CONFIG_P4HOME_PHASE5A_VALIDATION=y" "$HARDWARE_SDKCONFIG"
          grep -qx "# CONFIG_P4HOME_AGENT_TRANSPORT_ENABLED is not set" "$HARDWARE_SDKCONFIG"
          echo "EXPECTED_MAIN_TASK_STACK_SIZE=12288" >> "$GITHUB_ENV"

      - name: Prepare persistent Human Voice product profile
        if: inputs.validation_profile == 'product_human'
        run: |
          set -euo pipefail
          PRODUCT_CONFIG_DIR="$HOME/.config/p4home/product-voice"
          test -d "$PRODUCT_CONFIG_DIR"
          test "$(stat -f '%Lp' "$PRODUCT_CONFIG_DIR")" = "700"
          for private_file in device-id device-token agent-key.pem agent-cert.pem spki-sha256 agent-host agent-port; do
            test -f "$PRODUCT_CONFIG_DIR/$private_file"
            test ! -L "$PRODUCT_CONFIG_DIR/$private_file"
            file_mode="$(stat -f '%Lp' "$PRODUCT_CONFIG_DIR/$private_file")"
            [[ "$file_mode" == "600" || "$file_mode" == "400" ]]
          done
          if [[ -e "$PRODUCT_CONFIG_DIR/device-port" || -L "$PRODUCT_CONFIG_DIR/device-port" ]]; then
            test -f "$PRODUCT_CONFIG_DIR/device-port"
            test ! -L "$PRODUCT_CONFIG_DIR/device-port"
            device_port_mode="$(stat -f '%Lp' "$PRODUCT_CONFIG_DIR/device-port")"
            [[ "$device_port_mode" == "600" || "$device_port_mode" == "400" ]]
          fi
          openssl x509 -in "$PRODUCT_CONFIG_DIR/agent-cert.pem" -noout -text \
            | grep -q "Public Key Algorithm: rsaEncryption"
          PRODUCT_DEVICE_ID="$(head -n 1 "$PRODUCT_CONFIG_DIR/device-id")"
          PRODUCT_AGENT_HOST="$(head -n 1 "$PRODUCT_CONFIG_DIR/agent-host")"
          PRODUCT_AGENT_PORT="$(head -n 1 "$PRODUCT_CONFIG_DIR/agent-port")"
          PRODUCT_DEVICE_PORT="18444"
          if [[ -f "$PRODUCT_CONFIG_DIR/device-port" ]]; then
            PRODUCT_DEVICE_PORT="$(head -n 1 "$PRODUCT_CONFIG_DIR/device-port")"
          fi
          test "$AGENT_HOST" = "$PRODUCT_AGENT_HOST"
          test "$AGENT_PORT" = "$PRODUCT_AGENT_PORT"
          [[ "$PRODUCT_DEVICE_PORT" =~ ^[0-9]+$ ]]
          (( PRODUCT_DEVICE_PORT >= 1 && PRODUCT_DEVICE_PORT <= 65535 ))
          test "$PRODUCT_DEVICE_PORT" != "$PRODUCT_AGENT_PORT"
          PRODUCT_AGENT_URI="wss://$PRODUCT_AGENT_HOST:$PRODUCT_AGENT_PORT/v1/voice"
          PRODUCT_DEVICE_URI="wss://$PRODUCT_AGENT_HOST:$PRODUCT_DEVICE_PORT/v1/device"
          python3 scripts/prepare-phase5b-voice-profile.py \
            --sdkconfig "$HARDWARE_SDKCONFIG" \
            --uri "$PRODUCT_AGENT_URI" \
            --device-id "$PRODUCT_DEVICE_ID" \
            --token-file "$PRODUCT_CONFIG_DIR/device-token" \
            --spki-file "$PRODUCT_CONFIG_DIR/spki-sha256" \
            --profile product \
            --device-uri "$PRODUCT_DEVICE_URI"
          grep -qx "CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192" "$HARDWARE_SDKCONFIG"
          grep -qx "CONFIG_P4HOME_SR_ENABLE=y" "$HARDWARE_SDKCONFIG"
          grep -qx "CONFIG_P4HOME_VOICE_TRANSPORT_ENABLED=y" "$HARDWARE_SDKCONFIG"
          grep -qx "# CONFIG_P4HOME_AUDIO_STARTUP_SELFTEST is not set" "$HARDWARE_SDKCONFIG"
          grep -qx "# CONFIG_P4HOME_PHASE5A_VALIDATION is not set" "$HARDWARE_SDKCONFIG"
          grep -qx "# CONFIG_P4HOME_PHASE5B_VALIDATION is not set" "$HARDWARE_SDKCONFIG"
          grep -qx "CONFIG_P4HOME_AGENT_TRANSPORT_ENABLED=y" "$HARDWARE_SDKCONFIG"
          grep -qx "CONFIG_P4HOME_AGENT_PROTOCOL_VERSION=3" "$HARDWARE_SDKCONFIG"
          grep -qx "CONFIG_P4HOME_AGENT_TRANSPORT_TASK_STACK=12288" "$HARDWARE_SDKCONFIG"
          echo "P4HOME_PRODUCT_DEVICE_PORT=$PRODUCT_DEVICE_PORT" >> "$GITHUB_ENV"
          echo "EXPECTED_MAIN_TASK_STACK_SIZE=8192" >> "$GITHUB_ENV"
          echo "P4HOME_PRODUCT_HUMAN_AUDIT_STATUS_FILE=$RUNNER_TEMP/product-human-artifact-audit-status" >> "$GITHUB_ENV"

      - name: Prepare ephemeral Agent profile
        if: inputs.validation_profile == 'phase2d_agent' || inputs.validation_profile == 'phase3d_object' || inputs.validation_profile == 'phase5b_voice' || inputs.validation_profile == 'phase5c_stt' || inputs.validation_profile == 'phase5e_e2e' || inputs.validation_profile == 'phase5e_ui' || inputs.validation_profile == 'phase6h_cat_memory' || inputs.validation_profile == 'phase7_autonomy'
        run: |
          set -euo pipefail
          mkdir -p "$AGENT_TMP_DIR"
          chmod 700 "$AGENT_TMP_DIR"
          openssl req -x509 -newkey ec \
            -pkeyopt ec_paramgen_curve:prime256v1 \
            -nodes \
            -keyout "$AGENT_TMP_DIR/agent-key.pem" \
            -out "$AGENT_TMP_DIR/agent-cert.pem" \
            -days 1 \
            -subj "/CN=p4home-agent-harness"
          openssl rand -hex 32 > "$AGENT_TMP_DIR/device-token"
          openssl pkey -in "$AGENT_TMP_DIR/agent-key.pem" -pubout -outform DER \
            | openssl dgst -sha256 -hex \
            | awk '{print $2}' > "$AGENT_TMP_DIR/spki-sha256"
          chmod 600 "$AGENT_TMP_DIR"/*
          AGENT_DEVICE_ID="p4-hardware-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ "$VALIDATION_PROFILE" == "phase5b_voice" || \
                "$VALIDATION_PROFILE" == "phase5c_stt" || \
                "$VALIDATION_PROFILE" == "phase5e_e2e" || \
                "$VALIDATION_PROFILE" == "phase5e_ui" ]]; then
            AGENT_URI="wss://$AGENT_HOST:$AGENT_PORT/v1/voice"
            python3 scripts/prepare-phase5b-voice-profile.py \
              --sdkconfig "$HARDWARE_SDKCONFIG" \
              --uri "$AGENT_URI" \
              --device-id "$AGENT_DEVICE_ID" \
              --token-file "$AGENT_TMP_DIR/device-token" \
              --spki-file "$AGENT_TMP_DIR/spki-sha256"
          else
            AGENT_URI="wss://$AGENT_HOST:$AGENT_PORT/v1/device"
            python3 scripts/prepare-agent-hardware-sdkconfig.py \
              --sdkconfig "$HARDWARE_SDKCONFIG" \
              --uri "$AGENT_URI" \
              --device-id "$AGENT_DEVICE_ID" \
              --token-file "$AGENT_TMP_DIR/device-token" \
              --spki-file "$AGENT_TMP_DIR/spki-sha256" \
              --protocol-version "$AGENT_PROTOCOL_VERSION"
          fi
          if [[ "$VALIDATION_PROFILE" == "phase5b_voice" || \
                "$VALIDATION_PROFILE" == "phase5c_stt" || \
                "$VALIDATION_PROFILE" == "phase5e_e2e" || \
                "$VALIDATION_PROFILE" == "phase5e_ui" ]]; then
            grep -qx "CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_SR_ENABLE=y" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_PHASE5B_VALIDATION=y" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_BACKGROUND_TASKS_EXTERNAL_STACK=y" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y" "$HARDWARE_SDKCONFIG"
            grep -qx "# CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC is not set" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_VOICE_TRANSPORT_ENABLED=y" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_VOICE_TRANSPORT_TASK_STACK=12288" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_VOICE_WEBSOCKET_TASK_STACK=6144" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_VOICE_RECONNECT_TIMEOUT_MS=10000" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_HA_CLIENT_WS_TASK_STACK=8192" "$HARDWARE_SDKCONFIG"
            grep -qx "# CONFIG_P4HOME_AGENT_TRANSPORT_ENABLED is not set" "$HARDWARE_SDKCONFIG"
            echo "EXPECTED_MAIN_TASK_STACK_SIZE=8192" >> "$GITHUB_ENV"
          fi
          echo "AGENT_DEVICE_ID=$AGENT_DEVICE_ID" >> "$GITHUB_ENV"
          echo "AGENT_HARNESS_LOG=$AGENT_TMP_DIR/agent-harness.log" >> "$GITHUB_ENV"
          echo "AGENT_HARNESS_READY_FILE=$AGENT_TMP_DIR/ready" >> "$GITHUB_ENV"
          echo "AGENT_HARNESS_RESULT_FILE=$AGENT_TMP_DIR/result.json" >> "$GITHUB_ENV"
          echo "AGENT_HARNESS_STATUS_FILE=$AGENT_TMP_DIR/status" >> "$GITHUB_ENV"
          if [[ "$VALIDATION_PROFILE" == "phase6h_cat_memory" ]]; then
            echo "P4HOME_PHASE6H_AUDIT_DB=$AGENT_TMP_DIR/phase6h-memory.sqlite" >> "$GITHUB_ENV"
            echo "P4HOME_PHASE6H_AUDIT_STATUS_FILE=$AGENT_TMP_DIR/phase6h-audit-status" >> "$GITHUB_ENV"
            openssl rand -hex 24 > "$AGENT_TMP_DIR/phase6h-memory-canary"
            chmod 600 "$AGENT_TMP_DIR/phase6h-memory-canary"
            echo "P4HOME_PHASE6H_MEMORY_CANARY_FILE=$AGENT_TMP_DIR/phase6h-memory-canary" >> "$GITHUB_ENV"
            echo "P4HOME_PHASE6H_RAW_MONITOR_LOG=$AGENT_TMP_DIR/phase6h-raw-monitor.log" >> "$GITHUB_ENV"
          fi

      - name: Prepare Phase 7 real HA inputs
        if: inputs.validation_profile == 'phase7_autonomy'
        run: |
          set -euo pipefail
          ROBOT_CONFIG_DIR="$HOME/.config/p4home"
          ROBOT_TOKEN_FILE="$ROBOT_CONFIG_DIR/robot-ha.token"
          ROBOT_POLICY_FILE="$ROBOT_CONFIG_DIR/robot-ha-policy.json"
          ROBOT_URL_FILE="$ROBOT_CONFIG_DIR/robot-ha.url"
          test -s "$ROBOT_TOKEN_FILE"
          test -s "$ROBOT_POLICY_FILE"
          test -s "$ROBOT_URL_FILE"
          test "$(stat -f '%Lp' "$ROBOT_TOKEN_FILE")" = "600"
          test "$(stat -f '%Lp' "$ROBOT_POLICY_FILE")" = "600"
          test "$(stat -f '%Lp' "$ROBOT_URL_FILE")" = "600"
          P4HOME_PHASE7_HA_URL="$(head -n 1 "$ROBOT_URL_FILE")"
          case "$P4HOME_PHASE7_HA_URL" in
            http://*|https://*) ;;
            *) echo "Robot HA URL must use http or https" >&2; exit 1 ;;
          esac
          FROZEN_PHASE7_TOKEN_FILE="$AGENT_TMP_DIR/phase7-robot-ha.token"
          FROZEN_PHASE7_POLICY_FILE="$AGENT_TMP_DIR/phase7-robot-ha-policy.json"
          FROZEN_PHASE7_URL_FILE="$AGENT_TMP_DIR/phase7-robot-ha.url"
          cp "$ROBOT_TOKEN_FILE" "$FROZEN_PHASE7_TOKEN_FILE"
          cp "$ROBOT_POLICY_FILE" "$FROZEN_PHASE7_POLICY_FILE"
          cp "$ROBOT_URL_FILE" "$FROZEN_PHASE7_URL_FILE"
          chmod 400 "$FROZEN_PHASE7_TOKEN_FILE" "$FROZEN_PHASE7_POLICY_FILE" "$FROZEN_PHASE7_URL_FILE"
          P4HOME_PHASE7_HA_URL="$(head -n 1 "$FROZEN_PHASE7_URL_FILE")"
          echo "P4HOME_PHASE7_HA_URL=$P4HOME_PHASE7_HA_URL" >> "$GITHUB_ENV"
          echo "P4HOME_PHASE7_TOKEN_FILE=$FROZEN_PHASE7_TOKEN_FILE" >> "$GITHUB_ENV"
          echo "P4HOME_PHASE7_POLICY_FILE=$FROZEN_PHASE7_POLICY_FILE" >> "$GITHUB_ENV"
          echo "P4HOME_PHASE7_URL_FILE=$FROZEN_PHASE7_URL_FILE" >> "$GITHUB_ENV"
          echo "P4HOME_PHASE7_AUDIT_STATUS_FILE=$AGENT_TMP_DIR/phase7-artifact-audit-status" >> "$GITHUB_ENV"
          echo "P4HOME_PHASE7_RAW_MONITOR_LOG=$AGENT_TMP_DIR/phase7-raw-monitor.log" >> "$GITHUB_ENV"
          echo "P4HOME_PHASE7_CAPTURE_DURATION_FILE=$AGENT_TMP_DIR/phase7-capture-seconds" >> "$GITHUB_ENV"
          echo "OLLAMA_MODEL=qwen3.6:35b-mlx" >> "$GITHUB_ENV"

      - name: Prepare Phase 4C HA profile
        if: inputs.validation_profile == 'phase4c_ha' || inputs.validation_profile == 'phase5e_e2e' || inputs.validation_profile == 'phase5e_ui'
        run: |
          set -euo pipefail
          ROBOT_CONFIG_DIR="$HOME/.config/p4home"
          ROBOT_TOKEN_FILE="$ROBOT_CONFIG_DIR/robot-ha.token"
          ROBOT_POLICY_FILE="$ROBOT_CONFIG_DIR/robot-ha-policy.json"
          ROBOT_URL_FILE="$ROBOT_CONFIG_DIR/robot-ha.url"
          test -s "$ROBOT_TOKEN_FILE"
          test -s "$ROBOT_POLICY_FILE"
          test -s "$ROBOT_URL_FILE"
          test "$(stat -f '%Lp' "$ROBOT_TOKEN_FILE")" = "600"
          test "$(stat -f '%Lp' "$ROBOT_POLICY_FILE")" = "600"
          test "$(stat -f '%Lp' "$ROBOT_URL_FILE")" = "600"
          P4HOME_PHASE4C_HA_URL="$(head -n 1 "$ROBOT_URL_FILE")"
          case "$P4HOME_PHASE4C_HA_URL" in
            http://*|https://*) ;;
            *) echo "Robot HA URL must use http or https" >&2; exit 1 ;;
          esac
          mkdir -p "$AGENT_TMP_DIR"
          chmod 700 "$AGENT_TMP_DIR"
          FROZEN_ROBOT_TOKEN_FILE="$AGENT_TMP_DIR/robot-ha.token"
          FROZEN_ROBOT_POLICY_FILE="$AGENT_TMP_DIR/robot-ha-policy.json"
          cp "$ROBOT_TOKEN_FILE" "$FROZEN_ROBOT_TOKEN_FILE"
          cp "$ROBOT_POLICY_FILE" "$FROZEN_ROBOT_POLICY_FILE"
          chmod 400 "$FROZEN_ROBOT_TOKEN_FILE" "$FROZEN_ROBOT_POLICY_FILE"
          PHASE4C_ENTITY_FILE="$AGENT_TMP_DIR/phase4c-entity-id"
          phase4c_mode=()
          if [[ "$VALIDATION_PROFILE" == "phase5e_e2e" || \
                "$VALIDATION_PROFILE" == "phase5e_ui" ]]; then
            phase4c_mode=(--agent-ha-only)
          fi
          python3 scripts/prepare-phase4c-ha-profile.py \
            --sdkconfig "$HARDWARE_SDKCONFIG" \
            --policy "$FROZEN_ROBOT_POLICY_FILE" \
            --panel-entities firmware/components/panel_data_store/panel_entities.json \
            --entity-output "$PHASE4C_ENTITY_FILE" \
            --binding-output "$AGENT_TMP_DIR/phase4c-policy-binding" \
            "${phase4c_mode[@]}"
          if [[ "$VALIDATION_PROFILE" == "phase4c_ha" ]]; then
            grep -qx "CONFIG_P4HOME_PHASE4C_VALIDATION=y" "$HARDWARE_SDKCONFIG"
          else
            grep -qx "# CONFIG_P4HOME_PHASE4C_VALIDATION is not set" "$HARDWARE_SDKCONFIG"
          fi
          echo "P4HOME_PHASE4C_HA_URL=$P4HOME_PHASE4C_HA_URL" >> "$GITHUB_ENV"
          echo "P4HOME_PHASE4C_TOKEN_FILE=$FROZEN_ROBOT_TOKEN_FILE" >> "$GITHUB_ENV"
          echo "P4HOME_PHASE4C_POLICY_FILE=$FROZEN_ROBOT_POLICY_FILE" >> "$GITHUB_ENV"
          echo "PHASE4C_ENTITY_FILE=$PHASE4C_ENTITY_FILE" >> "$GITHUB_ENV"
          echo "PHASE4C_BINDING_STATUS_FILE=$AGENT_TMP_DIR/phase4c-policy-binding" >> "$GITHUB_ENV"
          echo "AGENT_HARNESS_LOG=$AGENT_TMP_DIR/agent-harness.log" >> "$GITHUB_ENV"
          echo "AGENT_HARNESS_RESULT_FILE=$AGENT_TMP_DIR/result.json" >> "$GITHUB_ENV"
          echo "AGENT_HARNESS_STATUS_FILE=$AGENT_TMP_DIR/status" >> "$GITHUB_ENV"
          echo "PHASE4C_OFFLINE_LOG=$AGENT_TMP_DIR/p4-offline.log" >> "$GITHUB_ENV"
          echo "PHASE4C_OFFLINE_RESULT_FILE=$AGENT_TMP_DIR/p4-offline-result.json" >> "$GITHUB_ENV"
          echo "PHASE4C_OFFLINE_STATUS_FILE=$AGENT_TMP_DIR/p4-offline-status" >> "$GITHUB_ENV"
          echo "PHASE4C_POST_ROBOT_OFFSET_FILE=$AGENT_TMP_DIR/post-robot-offset" >> "$GITHUB_ENV"
          echo "PHASE4C_SANITIZED_STATUS_FILE=$AGENT_TMP_DIR/serial-sanitized" >> "$GITHUB_ENV"
          echo "PHASE4C_RAW_MONITOR_LOG=$AGENT_TMP_DIR/raw-monitor.log" >> "$GITHUB_ENV"
          if [[ "$VALIDATION_PROFILE" == "phase5e_e2e" || \
                "$VALIDATION_PROFILE" == "phase5e_ui" ]]; then
            echo "P4HOME_PHASE5E_PROMPT_FILE=$AGENT_TMP_DIR/private-prompts.json" >> "$GITHUB_ENV"
            echo "P4HOME_PHASE5E_PROGRESS_FILE=$AGENT_TMP_DIR/progress.json" >> "$GITHUB_ENV"
            echo "P4HOME_PHASE5E_AUDIT_DB=$AGENT_TMP_DIR/phase5e-audit.db" >> "$GITHUB_ENV"
            echo "P4HOME_PHASE5E_AUDIT_STATUS_FILE=$AGENT_TMP_DIR/artifact-audit-status" >> "$GITHUB_ENV"
            if [[ "$VALIDATION_PROFILE" == "phase5e_e2e" ]]; then
              echo "P4HOME_PHASE5E_AUDIO_STATUS_FILE=$AGENT_TMP_DIR/audio-driver-status" >> "$GITHUB_ENV"
            else
              echo "P4HOME_PHASE5E_UI_INPUT_STATUS_FILE=$AGENT_TMP_DIR/ui-input-driver-status" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build firmware
        run: |
          set -euo pipefail
          . scripts/activate-idf-v5.5.4.sh
          idf.py \
            -C firmware \
            -B "$BUILD_DIR" \
            -D IDF_TARGET=esp32p4 \
            -D SDKCONFIG="$HARDWARE_SDKCONFIG" \
            build
          idf.py \
            -C firmware \
            -B "$BUILD_DIR" \
            -D IDF_TARGET=esp32p4 \
            -D SDKCONFIG="$HARDWARE_SDKCONFIG" \
            size --format json2 --output-file "$SIZE_REPORT"
          grep -qx "CONFIG_ESP_MAIN_TASK_STACK_SIZE=$EXPECTED_MAIN_TASK_STACK_SIZE" "$HARDWARE_SDKCONFIG"
          if [[ "${{ inputs.validation_profile }}" == "phase2d_agent" || \
                "${{ inputs.validation_profile }}" == "phase3d_object" || \
                "${{ inputs.validation_profile }}" == "phase6h_cat_memory" || \
                "${{ inputs.validation_profile }}" == "phase7_autonomy" ]]; then
            grep -qx "CONFIG_P4HOME_AGENT_TRANSPORT_TASK_STACK=$EXPECTED_AGENT_TASK_STACK_SIZE" "$HARDWARE_SDKCONFIG"
          fi
          if [[ "${{ inputs.validation_profile }}" == "phase5b_voice" || \
                "${{ inputs.validation_profile }}" == "phase5c_stt" || \
                "${{ inputs.validation_profile }}" == "phase5e_e2e" || \
                "${{ inputs.validation_profile }}" == "phase5e_ui" ]]; then
            grep -qx "CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_SR_ENABLE=y" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_PHASE5B_VALIDATION=y" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_BACKGROUND_TASKS_EXTERNAL_STACK=y" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y" "$HARDWARE_SDKCONFIG"
            grep -qx "# CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC is not set" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_VOICE_TRANSPORT_ENABLED=y" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_VOICE_TRANSPORT_TASK_STACK=12288" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_VOICE_WEBSOCKET_TASK_STACK=6144" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_VOICE_RECONNECT_TIMEOUT_MS=10000" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_HA_CLIENT_WS_TASK_STACK=8192" "$HARDWARE_SDKCONFIG"
            grep -qx "# CONFIG_P4HOME_AGENT_TRANSPORT_ENABLED is not set" "$HARDWARE_SDKCONFIG"
          fi
          if [[ "${{ inputs.validation_profile }}" == "product_human" ]]; then
            grep -qx "CONFIG_P4HOME_SR_ENABLE=y" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_VOICE_TRANSPORT_ENABLED=y" "$HARDWARE_SDKCONFIG"
            # Kconfig omits this dependent symbol entirely once the product
            # profile disables AUDIO_STARTUP_SELFTEST. Assert the effective
            # value instead of requiring a particular serialized n form.
            ! grep -qx "CONFIG_P4HOME_PHASE5A_VALIDATION=y" "$HARDWARE_SDKCONFIG"
            grep -qx "# CONFIG_P4HOME_PHASE5B_VALIDATION is not set" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_AGENT_TRANSPORT_ENABLED=y" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_AGENT_PROTOCOL_VERSION=3" "$HARDWARE_SDKCONFIG"
            grep -qx "CONFIG_P4HOME_AGENT_TRANSPORT_TASK_STACK=12288" "$HARDWARE_SDKCONFIG"
          fi
          test "$(shasum -a 256 firmware/dependencies.lock | awk '{print $1}')" = "$DEPENDENCY_LOCK_SHA256_BEFORE"

      - name: Validate persistent Human Voice service
        if: inputs.validation_profile == 'product_human'
        run: |
          set -euo pipefail
          nc -z 127.0.0.1 "$AGENT_PORT"
          nc -z 127.0.0.1 "$P4HOME_PRODUCT_DEVICE_PORT"
          EXPECTED_SERVICE_SPKI_SHA256="$(head -n 1 "$HOME/.config/p4home/product-voice/spki-sha256")"
          for service_port in "$AGENT_PORT" "$P4HOME_PRODUCT_DEVICE_PORT"; do
            PRODUCT_SERVICE_CERT="$RUNNER_TEMP/product-human-service-$service_port-cert.pem"
            openssl s_client \
              -connect "127.0.0.1:$service_port" \
              -servername p4home-product-human \
              -showcerts < /dev/null 2> /dev/null \
              | openssl x509 -outform PEM > "$PRODUCT_SERVICE_CERT"
            SERVICE_SPKI_SHA256="$(
              openssl x509 -in "$PRODUCT_SERVICE_CERT" -pubkey -noout \
                | openssl pkey -pubin -outform DER 2> /dev/null \
                | shasum -a 256 \
                | awk '{print $1}'
            )"
            test "$SERVICE_SPKI_SHA256" = "$EXPECTED_SERVICE_SPKI_SHA256"
          done

      - name: Set up Node for Agent harness
        if: inputs.validation_profile == 'phase2d_agent' || inputs.validation_profile == 'phase3d_object' || inputs.validation_profile == 'phase4c_ha' || inputs.validation_profile == 'phase5b_voice' || inputs.validation_profile == 'phase5c_stt' || inputs.validation_profile == 'phase5e_e2e' || inputs.validation_profile == 'phase5e_ui' || inputs.validation_profile == 'phase6h_cat_memory' || inputs.validation_profile == 'phase7_autonomy'
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Start Agent Runtime harness
        if: inputs.validation_profile == 'phase2d_agent' || inputs.validation_profile == 'phase3d_object' || inputs.validation_profile == 'phase5b_voice' || inputs.validation_profile == 'phase5c_stt' || inputs.validation_profile == 'phase5e_e2e' || inputs.validation_profile == 'phase5e_ui' || inputs.validation_profile == 'phase6h_cat_memory' || inputs.validation_profile == 'phase7_autonomy'
        shell: zsh {0}
        working-directory: agent
        run: |
          set -euo pipefail
          PNPM_BIN="$(command -v pnpm || true)"
          if [[ -z "$PNPM_BIN" && -x /opt/homebrew/bin/pnpm ]]; then
            PNPM_BIN=/opt/homebrew/bin/pnpm
          fi
          test -n "$PNPM_BIN"
          test "$("$PNPM_BIN" --version)" = "11.19.0"
          AGENT_NODE_BIN="$(command -v node)"
          test -x "$AGENT_NODE_BIN"
          test "$("$AGENT_NODE_BIN" --version)" = "v24.19.0"
          echo "AGENT_NODE_BIN=$AGENT_NODE_BIN" >> "$GITHUB_ENV"
          "$PNPM_BIN" install --frozen-lockfile
          if [[ "$VALIDATION_PROFILE" == "phase5b_voice" || \
                "$VALIDATION_PROFILE" == "phase5c_stt" || \
                "$VALIDATION_PROFILE" == "phase5e_e2e" || \
                "$VALIDATION_PROFILE" == "phase5e_ui" ]]; then
            # The Voice harness is launched after flashing so its bounded
            # capture deadline measures device runtime, not flash time.
            exit 0
          fi
          export P4HOME_AGENT_DEVICE_ID="$AGENT_DEVICE_ID"
          export P4HOME_AGENT_DEVICE_TOKEN_FILE="$AGENT_TMP_DIR/device-token"
          export P4HOME_AGENT_TLS_KEY_FILE="$AGENT_TMP_DIR/agent-key.pem"
          export P4HOME_AGENT_TLS_CERT_FILE="$AGENT_TMP_DIR/agent-cert.pem"
          export P4HOME_AGENT_PORT="$AGENT_PORT"
          export P4HOME_HARDWARE_PROFILE="$VALIDATION_PROFILE"
          export P4HOME_HARNESS_READY_FILE="$AGENT_HARNESS_READY_FILE"
          export P4HOME_HARNESS_RESULT_FILE="$AGENT_HARNESS_RESULT_FILE"
          export P4HOME_HARNESS_STATUS_FILE="$AGENT_HARNESS_STATUS_FILE"
          if [[ "$VALIDATION_PROFILE" == "phase6h_cat_memory" ]]; then
            export P4HOME_PHASE6H_AUDIT_DB P4HOME_PHASE6H_MEMORY_CANARY_FILE
          fi
          if [[ "$VALIDATION_PROFILE" == "phase7_autonomy" ]]; then
            export P4HOME_PHASE7_HA_URL P4HOME_PHASE7_TOKEN_FILE P4HOME_PHASE7_POLICY_FILE
            HARNESS_ENTRYPOINT=apps/device-harness/src/phase7-autonomy-cli.ts
          else
            HARNESS_ENTRYPOINT=apps/device-harness/src/cli.ts
          fi
          export HARNESS_ENTRYPOINT
          nohup zsh -c '
            node --import tsx "$HARNESS_ENTRYPOINT"
            exit_code=$?
            echo "$exit_code" > "$P4HOME_HARNESS_STATUS_FILE"
          ' > "$AGENT_HARNESS_LOG" 2>&1 &
          echo "$!" > "$AGENT_TMP_DIR/pid"
          for attempt in {1..300}; do
            if [[ -s "$AGENT_HARNESS_READY_FILE" ]]; then
              exit 0
            fi
            if [[ -s "$AGENT_HARNESS_STATUS_FILE" ]]; then
              tail -n 50 "$AGENT_HARNESS_LOG"
              exit 1
            fi
            sleep 0.1
          done
          echo "Agent Runtime harness did not become ready" >&2
          exit 1

      - name: Prepare pinned Phase 5C STT runtime
        if: inputs.validation_profile == 'phase5c_stt' || inputs.validation_profile == 'phase5e_e2e' || inputs.validation_profile == 'phase5e_ui'
        shell: zsh {0}
        working-directory: agent/packages/provider-stt/python
        run: |
          set -euo pipefail
          UV_BIN="$(command -v uv || true)"
          if [[ -z "$UV_BIN" && -x /opt/homebrew/bin/uv ]]; then
            UV_BIN=/opt/homebrew/bin/uv
          fi
          PYTHON312_BIN=/opt/homebrew/bin/python3.12
          test -x "$UV_BIN"
          test -x "$PYTHON312_BIN"
          test "$($PYTHON312_BIN -c 'import sys; print(".".join(map(str, sys.version_info[:2])))')" = "3.12"
          "$UV_BIN" sync --frozen --python "$PYTHON312_BIN"
          export HF_HUB_DISABLE_XET=1
          STT_PYTHON="$PWD/.venv/bin/python"
          STT_WORKER="$PWD/p4home_stt_worker.py"
          STT_MODEL_REVISION="$($STT_PYTHON -c 'from prepare_model import MODEL_REVISION; print(MODEL_REVISION)')"
          STT_MODEL="$HOME/Library/Caches/p4home/stt/whisper-small-$STT_MODEL_REVISION"
          mkdir -p "${STT_MODEL:h}"
          if [[ -e "$STT_MODEL" ]]; then
            "$STT_PYTHON" prepare_model.py --verify "$STT_MODEL"
          else
            "$STT_PYTHON" prepare_model.py --output "$STT_MODEL"
          fi
          "$STT_PYTHON" prepare_model.py --verify "$STT_MODEL"
          STT_MODEL_MANIFEST_SHA256="$(shasum -a 256 "$STT_MODEL/p4home-model-manifest.json" | awk '{print $1}')"
          echo "P4HOME_STT_PYTHON=$STT_PYTHON" >> "$GITHUB_ENV"
          echo "P4HOME_STT_WORKER=$STT_WORKER" >> "$GITHUB_ENV"
          echo "P4HOME_STT_MODEL=$STT_MODEL" >> "$GITHUB_ENV"
          echo "P4HOME_STT_MODEL_REVISION=$STT_MODEL_REVISION" >> "$GITHUB_ENV"
          echo "P4HOME_STT_MODEL_MANIFEST_SHA256=$STT_MODEL_MANIFEST_SHA256" >> "$GITHUB_ENV"
          echo "P4HOME_STT_AUDIT_DB=$AGENT_TMP_DIR/phase5c-audit.db" >> "$GITHUB_ENV"

      - name: Prepare pinned Phase 5E TTS runtime
        if: inputs.validation_profile == 'phase5e_e2e'
        shell: zsh {0}
        working-directory: agent/packages/provider-tts/python
        run: |
          set -euo pipefail
          UV_BIN="$(command -v uv || true)"
          if [[ -z "$UV_BIN" && -x /opt/homebrew/bin/uv ]]; then
            UV_BIN=/opt/homebrew/bin/uv
          fi
          PYTHON312_BIN=/opt/homebrew/bin/python3.12
          test -x "$UV_BIN"
          test -x "$PYTHON312_BIN"
          test "$($PYTHON312_BIN -c 'import sys; print(".".join(map(str, sys.version_info[:2])))')" = "3.12"
          "$UV_BIN" sync --frozen --python "$PYTHON312_BIN"
          export HF_HUB_DISABLE_XET=1
          TTS_PYTHON="$PWD/.venv/bin/python"
          TTS_WORKER="$PWD/p4home_tts_worker.py"
          TTS_MODEL_REVISION="$($TTS_PYTHON -c 'from prepare_model import MODEL_REVISION; print(MODEL_REVISION)')"
          TTS_MODEL="$HOME/Library/Caches/p4home/tts/kokoro-$TTS_MODEL_REVISION"
          mkdir -p "${TTS_MODEL:h}"
          if [[ -e "$TTS_MODEL" ]]; then
            "$TTS_PYTHON" prepare_model.py --verify "$TTS_MODEL"
          else
            "$TTS_PYTHON" prepare_model.py --output "$TTS_MODEL"
          fi
          "$TTS_PYTHON" prepare_model.py --verify "$TTS_MODEL"
          TTS_MODEL_MANIFEST_SHA256="$(shasum -a 256 "$TTS_MODEL/p4home-model-manifest.json" | awk '{print $1}')"
          echo "P4HOME_TTS_PYTHON=$TTS_PYTHON" >> "$GITHUB_ENV"
          echo "P4HOME_TTS_WORKER=$TTS_WORKER" >> "$GITHUB_ENV"
          echo "P4HOME_TTS_MODEL=$TTS_MODEL" >> "$GITHUB_ENV"
          echo "P4HOME_TTS_MODEL_REVISION=$TTS_MODEL_REVISION" >> "$GITHUB_ENV"
          echo "P4HOME_TTS_MODEL_MANIFEST_SHA256=$TTS_MODEL_MANIFEST_SHA256" >> "$GITHUB_ENV"

      - name: Install Phase 4C gate dependencies
        if: inputs.validation_profile == 'phase4c_ha'
        shell: zsh {0}
        working-directory: agent
        run: |
          set -euo pipefail
          phase4c_node_bin="$(command -v node)"
          test -x "$phase4c_node_bin"
          test "$("$phase4c_node_bin" --version)" = "v24.19.0"
          echo "PHASE4C_NODE_BIN=$phase4c_node_bin" >> "$GITHUB_ENV"
          PNPM_BIN="$(command -v pnpm || true)"
          if [[ -z "$PNPM_BIN" && -x /opt/homebrew/bin/pnpm ]]; then
            PNPM_BIN=/opt/homebrew/bin/pnpm
          fi
          test -n "$PNPM_BIN"
          test "$("$PNPM_BIN" --version)" = "11.19.0"
          "$PNPM_BIN" install --frozen-lockfile

      - name: Validate Robot while P4 application is offline
        if: inputs.validation_profile == 'phase4c_ha'
        run: |
          set -euo pipefail
          . scripts/activate-idf-v5.5.4.sh
          python -m esptool \
            --chip esp32p4 \
            --port "$SERIAL_PORT" \
            --before default_reset \
            --after no_reset \
            chip_id > /dev/null
          set +e
          (
            cd agent
            AGENT_HARNESS_RESULT_FILE="$PHASE4C_OFFLINE_RESULT_FILE" \
              "$PHASE4C_NODE_BIN" --import tsx apps/runtime/src/phase4c-ha-gate.ts
          ) > "$PHASE4C_OFFLINE_LOG" 2>&1
          offline_exit_code=$?
          set -e
          echo "$offline_exit_code" > "$PHASE4C_OFFLINE_STATUS_FILE"

      - name: Flash firmware and capture serial
        id: flash_capture
        run: |
          set -euo pipefail
          monitor_log="firmware/monitor.log"
          if [[ "$VALIDATION_PROFILE" == "phase4c_ha" || \
                "$VALIDATION_PROFILE" == "phase5e_e2e" || \
                "$VALIDATION_PROFILE" == "phase5e_ui" ]]; then
            monitor_log="$PHASE4C_RAW_MONITOR_LOG"
            rm -f firmware/monitor.log
          elif [[ "$VALIDATION_PROFILE" == "phase6h_cat_memory" ]]; then
            monitor_log="$P4HOME_PHASE6H_RAW_MONITOR_LOG"
            rm -f firmware/monitor.log
          elif [[ "$VALIDATION_PROFILE" == "phase7_autonomy" ]]; then
            monitor_log="$P4HOME_PHASE7_RAW_MONITOR_LOG"
            rm -f firmware/monitor.log
          fi
          write_transport_status() {
            local exit_code="$1"
            printf '%d\n' "$exit_code" > "$TRANSPORT_STATUS_FILE"
            if (( exit_code != 0 )); then
              printf '\nVERIFY:transport:flash_capture:FAIL exit_code=%d\n' \
                "$exit_code" >> "$monitor_log"
            fi
          }
          record_transport_exit() {
            local exit_code=$?
            trap - EXIT
            set +e
            write_transport_status "$exit_code"
            exit "$exit_code"
          }
          trap record_transport_exit EXIT
          . scripts/activate-idf-v5.5.4.sh
          idf.py \
            -C firmware \
            -B "$BUILD_DIR" \
            -D IDF_TARGET=esp32p4 \
            -D SDKCONFIG="$HARDWARE_SDKCONFIG" \
            -p "$SERIAL_PORT" \
            -b "$FLASH_BAUD" \
            flash > "$monitor_log" 2>&1
          if [[ "$VALIDATION_PROFILE" == "phase5b_voice" || \
                "$VALIDATION_PROFILE" == "phase5c_stt" || \
                "$VALIDATION_PROFILE" == "phase5e_e2e" || \
                "$VALIDATION_PROFILE" == "phase5e_ui" ]]; then
            pushd agent > /dev/null
            export P4HOME_AGENT_DEVICE_ID="$AGENT_DEVICE_ID"
            export P4HOME_AGENT_DEVICE_TOKEN_FILE="$AGENT_TMP_DIR/device-token"
            export P4HOME_AGENT_TLS_KEY_FILE="$AGENT_TMP_DIR/agent-key.pem"
            export P4HOME_AGENT_TLS_CERT_FILE="$AGENT_TMP_DIR/agent-cert.pem"
            export P4HOME_AGENT_PORT="$AGENT_PORT"
            export P4HOME_HARDWARE_PROFILE="$VALIDATION_PROFILE"
            export P4HOME_HARNESS_READY_FILE="$AGENT_HARNESS_READY_FILE"
            export P4HOME_HARNESS_RESULT_FILE="$AGENT_HARNESS_RESULT_FILE"
            export P4HOME_HARNESS_STATUS_FILE="$AGENT_HARNESS_STATUS_FILE"
            export P4HOME_HARNESS_NODE_PID_FILE="$AGENT_TMP_DIR/node-pid"
            export AGENT_NODE_BIN
            if [[ "$VALIDATION_PROFILE" == "phase5e_e2e" ]]; then
              export P4HOME_STT_PYTHON P4HOME_STT_WORKER P4HOME_STT_MODEL
              export P4HOME_TTS_PYTHON P4HOME_TTS_WORKER P4HOME_TTS_MODEL
              export P4HOME_PHASE4C_HA_URL P4HOME_PHASE4C_TOKEN_FILE P4HOME_PHASE4C_POLICY_FILE
              export P4HOME_PHASE5E_PROMPT_FILE P4HOME_PHASE5E_PROGRESS_FILE P4HOME_PHASE5E_AUDIT_DB
              export P4HOME_PHASE5E_AUDIO_STATUS_FILE
              HARNESS_ENTRYPOINT=apps/device-harness/src/voice-e2e-cli.ts
            elif [[ "$VALIDATION_PROFILE" == "phase5e_ui" ]]; then
              export P4HOME_STT_PYTHON P4HOME_STT_WORKER P4HOME_STT_MODEL
              export P4HOME_PHASE4C_HA_URL P4HOME_PHASE4C_TOKEN_FILE P4HOME_PHASE4C_POLICY_FILE
              export P4HOME_PHASE5E_PROMPT_FILE P4HOME_PHASE5E_PROGRESS_FILE P4HOME_PHASE5E_AUDIT_DB
              export P4HOME_PHASE5E_UI_INPUT_STATUS_FILE
              HARNESS_ENTRYPOINT=apps/device-harness/src/voice-ui-e2e-cli.ts
            elif [[ "$VALIDATION_PROFILE" == "phase5c_stt" ]]; then
              export P4HOME_STT_PYTHON P4HOME_STT_WORKER P4HOME_STT_MODEL P4HOME_STT_AUDIT_DB
              HARNESS_ENTRYPOINT=apps/device-harness/src/voice-stt-cli.ts
            else
              HARNESS_ENTRYPOINT=apps/device-harness/src/voice-cli.ts
            fi
            export HARNESS_ENTRYPOINT
            nohup zsh -c '
              forward_signal() {
                kill -TERM "$child_pid" 2>/dev/null || true
                wait "$child_pid" 2>/dev/null || true
                : > "$P4HOME_HARNESS_NODE_PID_FILE"
                echo 143 > "$P4HOME_HARNESS_STATUS_FILE"
                exit 143
              }
              trap forward_signal TERM INT HUP
              "$AGENT_NODE_BIN" --import tsx "$HARNESS_ENTRYPOINT" &
              child_pid=$!
              echo "$child_pid" > "$P4HOME_HARNESS_NODE_PID_FILE"
              wait "$child_pid"
              exit_code=$?
              : > "$P4HOME_HARNESS_NODE_PID_FILE"
              echo "$exit_code" > "$P4HOME_HARNESS_STATUS_FILE"
              exit "$exit_code"
            ' > "$AGENT_HARNESS_LOG" 2>&1 &
            harness_pid=$!
            echo "$harness_pid" > "$AGENT_TMP_DIR/pid"
            popd > /dev/null
            audio_driver_pid=""
            cleanup_background() {
              if [[ "$audio_driver_pid" == <-> ]]; then
                kill -TERM "$audio_driver_pid" 2>/dev/null || true
                wait "$audio_driver_pid" 2>/dev/null || true
              fi
              if kill -0 "$harness_pid" 2>/dev/null; then
                kill -TERM "$harness_pid" 2>/dev/null || true
              fi
              node_pid=""
              if [[ -s "$P4HOME_HARNESS_NODE_PID_FILE" ]]; then
                node_pid="$(head -n 1 "$P4HOME_HARNESS_NODE_PID_FILE")"
              fi
              for cleanup_attempt in {1..700}; do
                wrapper_live=no
                node_live=no
                kill -0 "$harness_pid" 2>/dev/null && wrapper_live=yes
                if [[ "$node_pid" == <-> ]] && kill -0 "$node_pid" 2>/dev/null; then
                  node_live=yes
                fi
                if [[ "$wrapper_live" == no && "$node_live" == no ]]; then
                  break
                fi
                sleep 0.1
              done
              if [[ "$node_pid" == <-> ]] && kill -0 "$node_pid" 2>/dev/null; then
                kill -KILL "$node_pid" 2>/dev/null || true
              fi
              kill -KILL "$harness_pid" 2>/dev/null || true
              wait "$harness_pid" 2>/dev/null || true
              if [[ "$node_pid" == <-> ]] && kill -0 "$node_pid" 2>/dev/null; then
                echo "Agent Runtime Node child survived cleanup" >&2
                return 1
              fi
            }
            cleanup_and_record_transport_exit() {
              local exit_code=$?
              local cleanup_exit_code=0
              trap - EXIT
              set +e
              cleanup_background
              cleanup_exit_code=$?
              if (( exit_code == 0 && cleanup_exit_code != 0 )); then
                exit_code="$cleanup_exit_code"
              fi
              write_transport_status "$exit_code"
              exit "$exit_code"
            }
            trap cleanup_and_record_transport_exit EXIT
            ready_attempts=300
            phase5e_artifact_only=no
            if [[ "$VALIDATION_PROFILE" == "phase5e_e2e" || \
                  "$VALIDATION_PROFILE" == "phase5e_ui" ]]; then
              ready_attempts=1200
              phase5e_artifact_only=yes
            fi
            for ((attempt = 1; attempt <= ready_attempts; attempt++)); do
              if [[ -s "$AGENT_HARNESS_READY_FILE" ]]; then
                break
              fi
              if [[ -s "$AGENT_HARNESS_STATUS_FILE" ]]; then
                wait "$harness_pid" 2>/dev/null || true
                if [[ "$phase5e_artifact_only" == "yes" ]]; then
                  break
                fi
                tail -n 50 "$AGENT_HARNESS_LOG"
                exit 1
              fi
              sleep 0.1
            done
            if [[ ! -s "$AGENT_HARNESS_READY_FILE" ]]; then
              cleanup_background || true
              if [[ "$phase5e_artifact_only" == "yes" ]]; then
                printf 'HARNESS:phase5e:UNAVAILABLE evidence_capture=continuing\n' \
                  >> "$AGENT_HARNESS_LOG"
              else
                tail -n 50 "$AGENT_HARNESS_LOG" || true
                echo "Agent Runtime harness did not become ready" >&2
                exit 1
              fi
            else
              test -s "$AGENT_HARNESS_READY_FILE"
            fi
          fi
          if [[ "$VALIDATION_PROFILE" == "phase5c_stt" ]]; then
            (
              sleep 25
              for attempt in {1..3}; do
                if [[ -s "$AGENT_HARNESS_STATUS_FILE" ]]; then
                  break
                fi
                capture_count_before="$(grep -c 'voice_transport: capture opened epoch=' \
                  firmware/monitor.log || true)"
                say -v Samantha "Hi ESP"
                capture_opened=no
                for poll in {1..250}; do
                  capture_count_after="$(grep -c 'voice_transport: capture opened epoch=' \
                    firmware/monitor.log || true)"
                  if (( capture_count_after > capture_count_before )); then
                    capture_opened=yes
                    break
                  fi
                  sleep 0.02
                done
                if [[ "$capture_opened" == "yes" ]]; then
                  say -v Tingting "你好，请介绍一下你自己"
                fi
                sleep 45
              done
            ) &
          fi
          if [[ "$VALIDATION_PROFILE" == "phase5e_e2e" ]]; then
            python3 scripts/drive-phase5e-mac-speaker.py \
              --prompt-file "$P4HOME_PHASE5E_PROMPT_FILE" \
              --progress-file "$P4HOME_PHASE5E_PROGRESS_FILE" \
              --monitor-log "$monitor_log" \
              --status-file "$P4HOME_PHASE5E_AUDIO_STATUS_FILE" &
            audio_driver_pid=$!
            echo "$audio_driver_pid" > "$AGENT_TMP_DIR/audio-driver-pid"
          fi
          if [[ "$VALIDATION_PROFILE" == "phase5e_ui" ]]; then
            python3 scripts/drive-phase5e-ui-speakerless.py \
              --prompt-file "$P4HOME_PHASE5E_PROMPT_FILE" \
              --progress-file "$P4HOME_PHASE5E_PROGRESS_FILE" \
              --monitor-log "$monitor_log" \
              --status-file "$P4HOME_PHASE5E_UI_INPUT_STATUS_FILE" &
            audio_driver_pid=$!
            echo "$audio_driver_pid" > "$AGENT_TMP_DIR/ui-input-driver-pid"
          fi
          if [[ "$VALIDATION_PROFILE" == "phase4c_ha" ]]; then
            python scripts/capture-esp-serial.py \
              --port "$SERIAL_PORT" \
              --seconds "$CAPTURE_SECONDS" \
              --output "$monitor_log" \
              --append \
              --reset &
            capture_pid=$!
            subscribed=no
            for ((attempt = 0; attempt < MONITOR_SECONDS * 5; attempt++)); do
              if grep -q "VERIFY:phase4c:p4_standalone:PASS" "$monitor_log"; then
                subscribed=yes
                break
              fi
              if ! kill -0 "$capture_pid" 2>/dev/null; then
                break
              fi
              sleep 0.2
            done
            gate_exit_code=1
            if [[ "$subscribed" == "yes" ]]; then
              set +e
              (
                cd agent
                "$PHASE4C_NODE_BIN" --import tsx apps/runtime/src/phase4c-ha-gate.ts
              ) > "$AGENT_HARNESS_LOG" 2>&1
              gate_exit_code=$?
              set -e
            else
              printf 'VERIFY:phase4c:robot_write:FAIL reason=p4_not_subscribed\n' \
                > "$AGENT_HARNESS_LOG"
            fi
            echo "$gate_exit_code" > "$AGENT_HARNESS_STATUS_FILE"
            post_robot_started_at=$SECONDS
            wc -c < "$monitor_log" > "$PHASE4C_POST_ROBOT_OFFSET_FILE"
            wait "$capture_pid"
            test "$((SECONDS - post_robot_started_at))" -ge 60
          elif [[ "$VALIDATION_PROFILE" == "phase7_autonomy" ]]; then
            python scripts/capture-esp-serial.py \
              --port "$SERIAL_PORT" \
              --seconds "$CAPTURE_SECONDS" \
              --output "$monitor_log" \
              --append \
              --reset \
              --stop-file "$AGENT_HARNESS_STATUS_FILE" \
              --post-stop-seconds 35 \
              --duration-file "$P4HOME_PHASE7_CAPTURE_DURATION_FILE"
            test -s "$AGENT_HARNESS_STATUS_FILE"
            test -s "$P4HOME_PHASE7_CAPTURE_DURATION_FILE"
          else
            python scripts/capture-esp-serial.py \
              --port "$SERIAL_PORT" \
              --seconds "$CAPTURE_SECONDS" \
              --output "$monitor_log" \
              --append \
              --reset
          fi

      - name: Append Agent harness evidence
        if: always() && inputs.validation_profile != 'generic' && inputs.validation_profile != 'product_human'
        run: |
          set -euo pipefail
          if [[ "$VALIDATION_PROFILE" == "phase5a_voice" ]]; then
            exit 0
          fi
          harness_wait_attempts=1200
          if [[ "$VALIDATION_PROFILE" == "phase7_autonomy" ]]; then
            # The capture step already requires terminal status with at least
            # 35 seconds left for a post-terminal P4 HA heartbeat sample.
            harness_wait_attempts=1
          fi
          if [[ "$VALIDATION_PROFILE" == "phase5b_voice" || \
                "$VALIDATION_PROFILE" == "phase5c_stt" || \
                "$VALIDATION_PROFILE" == "phase5e_e2e" || \
                "$VALIDATION_PROFILE" == "phase5e_ui" || \
                "$VALIDATION_PROFILE" == "phase7_autonomy" ]]; then
            for ((attempt = 1; attempt <= harness_wait_attempts; attempt++)); do
              if [[ -s "$AGENT_HARNESS_STATUS_FILE" ]]; then
                break
              fi
              sleep 0.1
            done
          fi
          if [[ "$VALIDATION_PROFILE" == "phase4c_ha" && -s "$PHASE4C_OFFLINE_LOG" ]]; then
            printf '\n$ phase4c-robot-gate p4_application=offline\n' >> "$PHASE4C_RAW_MONITOR_LOG"
            tee -a "$PHASE4C_RAW_MONITOR_LOG" < "$PHASE4C_OFFLINE_LOG" > /dev/null
          fi
          if [[ -s "$AGENT_HARNESS_LOG" ]]; then
            if [[ "$VALIDATION_PROFILE" == "phase4c_ha" || \
                  "$VALIDATION_PROFILE" == "phase5e_e2e" || \
                  "$VALIDATION_PROFILE" == "phase5e_ui" ]]; then
              harness_monitor_log="$PHASE4C_RAW_MONITOR_LOG"
            elif [[ "$VALIDATION_PROFILE" == "phase6h_cat_memory" ]]; then
              harness_monitor_log="$P4HOME_PHASE6H_RAW_MONITOR_LOG"
            elif [[ "$VALIDATION_PROFILE" == "phase7_autonomy" ]]; then
              harness_monitor_log="$P4HOME_PHASE7_RAW_MONITOR_LOG"
            else
              harness_monitor_log="firmware/monitor.log"
            fi
            printf '\n$ agent-hardware-harness profile=%s\n' "$VALIDATION_PROFILE" >> "$harness_monitor_log"
            tee -a "$harness_monitor_log" < "$AGENT_HARNESS_LOG" > /dev/null
          fi

      - name: Sanitize Phase 4C serial artifact
        if: always() && (inputs.validation_profile == 'phase4c_ha' || inputs.validation_profile == 'phase5e_e2e' || inputs.validation_profile == 'phase5e_ui')
        run: |
          set -euo pipefail
          test -s "$PHASE4C_ENTITY_FILE"
          test -f "$PHASE4C_RAW_MONITOR_LOG"
          python3 scripts/sanitize-phase4c-monitor.py \
            --log "$PHASE4C_RAW_MONITOR_LOG" \
            --output firmware/monitor.log \
            --entity-file "$PHASE4C_ENTITY_FILE" \
            --status-file "$PHASE4C_SANITIZED_STATUS_FILE"

      - name: Preflight Phase 5E upload candidates
        if: always() && (inputs.validation_profile == 'phase5e_e2e' || inputs.validation_profile == 'phase5e_ui')
        run: |
          set -euo pipefail
          artifact_args=(--artifact firmware/monitor.log)
          if [[ -s "$AGENT_HARNESS_RESULT_FILE" ]]; then
            artifact_args+=(--artifact "$AGENT_HARNESS_RESULT_FILE")
            artifact_args+=(--result "$AGENT_HARNESS_RESULT_FILE")
          fi
          audit_db_args=()
          if [[ -s "$P4HOME_PHASE5E_AUDIT_DB" ]]; then
            audit_db_args+=(--audit-db "$P4HOME_PHASE5E_AUDIT_DB")
          fi
          python3 scripts/audit-phase5e-artifacts.py \
            --repo "$GITHUB_WORKSPACE" \
            --source-archive "$P4HOME_SOURCE_ARCHIVE" \
            "${artifact_args[@]}" \
            --secret-file "$AGENT_TMP_DIR/device-token" \
            --secret-file "$AGENT_TMP_DIR/agent-key.pem" \
            --secret-file "$P4HOME_PHASE4C_TOKEN_FILE" \
            --artifact-sensitive-file "$PHASE4C_ENTITY_FILE" \
            "${audit_db_args[@]}" \
            --status-file "$P4HOME_PHASE5E_AUDIT_STATUS_FILE" \
            | tee -a firmware/monitor.log
          grep -qx "pass" "$P4HOME_PHASE5E_AUDIT_STATUS_FILE"

      - name: Audit Phase 6H upload candidates
        if: always() && inputs.validation_profile == 'phase6h_cat_memory'
        run: |
          set -euo pipefail
          test -s "$P4HOME_PHASE6H_RAW_MONITOR_LOG"
          python3 scripts/audit-phase6h-artifacts.py \
            --monitor "$P4HOME_PHASE6H_RAW_MONITOR_LOG" \
            --output firmware/monitor.log \
            --result "$AGENT_HARNESS_RESULT_FILE" \
            --memory-db "$P4HOME_PHASE6H_AUDIT_DB" \
            --memory-canary-file "$P4HOME_PHASE6H_MEMORY_CANARY_FILE" \
            --secret-file "$AGENT_TMP_DIR/device-token" \
            --secret-file "$AGENT_TMP_DIR/agent-key.pem" \
            --status-file "$P4HOME_PHASE6H_AUDIT_STATUS_FILE"
          grep -qx "pass" "$P4HOME_PHASE6H_AUDIT_STATUS_FILE"

      - name: Audit Phase 7 upload candidates
        if: always() && inputs.validation_profile == 'phase7_autonomy'
        run: |
          set -euo pipefail
          test -s "$P4HOME_PHASE7_RAW_MONITOR_LOG"
          audit_args=()
          if [[ -s "$AGENT_HARNESS_RESULT_FILE" ]]; then
            audit_args+=(--result "$AGENT_HARNESS_RESULT_FILE")
          fi
          python3 scripts/audit-phase7-artifacts.py \
            --monitor "$P4HOME_PHASE7_RAW_MONITOR_LOG" \
            --output firmware/monitor.log \
            "${audit_args[@]}" \
            --ha-policy "$P4HOME_PHASE7_POLICY_FILE" \
            --entity-catalog firmware/components/panel_data_store/panel_entities.json \
            --sdkconfig "$HARDWARE_SDKCONFIG" \
            --secret-file "$AGENT_TMP_DIR/device-token" \
            --secret-file "$AGENT_TMP_DIR/agent-key.pem" \
            --secret-file "$P4HOME_PHASE7_TOKEN_FILE" \
            --secret-file "$P4HOME_PHASE7_URL_FILE" \
            --status-file "$P4HOME_PHASE7_AUDIT_STATUS_FILE"
          grep -qx "pass" "$P4HOME_PHASE7_AUDIT_STATUS_FILE"

      - name: Audit persistent Human Voice upload candidates
        if: always() && inputs.validation_profile == 'product_human'
        run: |
          set -euo pipefail
          python3 scripts/audit-phase5e-artifacts.py \
            --repo "$GITHUB_WORKSPACE" \
            --source-archive "$P4HOME_SOURCE_ARCHIVE" \
            --artifact firmware/monitor.log \
            --secret-file "$HOME/.config/p4home/product-voice/device-token" \
            --secret-file "$HOME/.config/p4home/product-voice/agent-key.pem" \
            --status-file "$P4HOME_PRODUCT_HUMAN_AUDIT_STATUS_FILE" \
            | tee -a firmware/monitor.log
          grep -qx "pass" "$P4HOME_PRODUCT_HUMAN_AUDIT_STATUS_FILE"

      - name: Write hardware validation manifest
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          image = pathlib.Path(os.environ["BUILD_DIR"]) / "p4home_firmware.bin"
          dependency_lock = pathlib.Path("firmware/dependencies.lock")
          sdkconfig = pathlib.Path(os.environ["HARDWARE_SDKCONFIG"])
          size_report_path = pathlib.Path(os.environ["SIZE_REPORT"])
          harness_result_path = pathlib.Path(
              os.environ.get("AGENT_HARNESS_RESULT_FILE", "")
          )
          harness_status_path = pathlib.Path(
              os.environ.get("AGENT_HARNESS_STATUS_FILE", "")
          )
          offline_result_path = pathlib.Path(
              os.environ.get("PHASE4C_OFFLINE_RESULT_FILE", "")
          )
          offline_status_path = pathlib.Path(
              os.environ.get("PHASE4C_OFFLINE_STATUS_FILE", "")
          )
          post_robot_offset_path = pathlib.Path(
              os.environ.get("PHASE4C_POST_ROBOT_OFFSET_FILE", "")
          )
          sanitized_status_path = pathlib.Path(
              os.environ.get("PHASE4C_SANITIZED_STATUS_FILE", "")
          )
          binding_status_path = pathlib.Path(
              os.environ.get("PHASE4C_BINDING_STATUS_FILE", "")
          )
          phase5e_audio_status_path = pathlib.Path(
              os.environ.get("P4HOME_PHASE5E_AUDIO_STATUS_FILE", "")
          )
          phase5e_ui_input_status_path = pathlib.Path(
              os.environ.get("P4HOME_PHASE5E_UI_INPUT_STATUS_FILE", "")
          )
          phase5e_audit_status_path = pathlib.Path(
              os.environ.get("P4HOME_PHASE5E_AUDIT_STATUS_FILE", "")
          )
          product_human_audit_status_path = pathlib.Path(
              os.environ.get("P4HOME_PRODUCT_HUMAN_AUDIT_STATUS_FILE", "")
          )
          phase7_audit_status_path = pathlib.Path(
              os.environ.get("P4HOME_PHASE7_AUDIT_STATUS_FILE", "")
          )
          transport_status_path = pathlib.Path(
              os.environ.get("TRANSPORT_STATUS_FILE", "")
          )

          def read_json(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8")) if path.is_file() else None
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  return None

          main_stack_prefix = "CONFIG_ESP_MAIN_TASK_STACK_SIZE="
          agent_stack_prefix = "CONFIG_P4HOME_AGENT_TRANSPORT_TASK_STACK="
          agent_transport_enabled_prefix = "CONFIG_P4HOME_AGENT_TRANSPORT_ENABLED="
          agent_transport_disabled_line = "# CONFIG_P4HOME_AGENT_TRANSPORT_ENABLED is not set"
          agent_protocol_version_prefix = "CONFIG_P4HOME_AGENT_PROTOCOL_VERSION="
          phase4c_validation_prefix = "CONFIG_P4HOME_PHASE4C_VALIDATION="
          phase5a_validation_prefix = "CONFIG_P4HOME_PHASE5A_VALIDATION="
          phase5b_validation_prefix = "CONFIG_P4HOME_PHASE5B_VALIDATION="
          background_tasks_external_stack_prefix = "CONFIG_P4HOME_BACKGROUND_TASKS_EXTERNAL_STACK="
          voice_transport_enabled_prefix = "CONFIG_P4HOME_VOICE_TRANSPORT_ENABLED="
          voice_transport_stack_prefix = "CONFIG_P4HOME_VOICE_TRANSPORT_TASK_STACK="
          voice_websocket_stack_prefix = "CONFIG_P4HOME_VOICE_WEBSOCKET_TASK_STACK="
          voice_reconnect_timeout_prefix = "CONFIG_P4HOME_VOICE_RECONNECT_TIMEOUT_MS="
          ha_websocket_stack_prefix = "CONFIG_P4HOME_HA_CLIENT_WS_TASK_STACK="
          mbedtls_external_mem_prefix = "CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC="
          sr_enable_prefix = "CONFIG_P4HOME_SR_ENABLE="
          audio_selftest_prefix = "CONFIG_P4HOME_AUDIO_STARTUP_SELFTEST="
          main_stack_size = None
          agent_stack_size = None
          agent_protocol_version = None
          phase4c_validation_enabled = False
          agent_transport_disabled = False
          phase4c_agent_transport_disabled = False
          phase5a_validation_enabled = False
          phase5a_sr_enabled = False
          phase5a_audio_selftest_enabled = False
          phase5a_agent_transport_disabled = False
          phase5b_validation_enabled = False
          phase5b_background_tasks_external_stack = False
          phase5b_voice_transport_enabled = False
          phase5b_voice_transport_stack_size = None
          phase5b_voice_websocket_stack_size = None
          phase5b_voice_reconnect_timeout_ms = None
          phase5b_ha_websocket_stack_size = None
          phase5b_mbedtls_external_mem_alloc = False
          phase5b_agent_transport_disabled = False
          phase5c_model_revision = os.environ.get("P4HOME_STT_MODEL_REVISION")
          phase5c_model_manifest_sha256 = os.environ.get(
              "P4HOME_STT_MODEL_MANIFEST_SHA256"
          )
          phase5e_tts_model_revision = os.environ.get("P4HOME_TTS_MODEL_REVISION")
          phase5e_tts_model_manifest_sha256 = os.environ.get(
              "P4HOME_TTS_MODEL_MANIFEST_SHA256"
          )
          phase4c_post_robot_p4_standalone = False
          phase4c_post_robot_ui_8fps = False
          profile = os.environ["VALIDATION_PROFILE"]
          monitor_path = pathlib.Path("firmware/monitor.log")
          monitor_text = (
              monitor_path.read_text(encoding="utf-8", errors="replace")
              if monitor_path.is_file()
              else ""
          )
          phase5e_poweron_count = monitor_text.count("rst:0x1 (POWERON)")
          phase5e_reset_banner_count = monitor_text.count("rst:0x")
          phase5e_crash_marker_count = sum(
              monitor_text.lower().count(marker)
              for marker in (
                  "guru meditation", "panic'ed", "task watchdog", "brownout",
                  "assert failed", "backtrace:",
              )
          )
          if post_robot_offset_path.is_file() and monitor_path.is_file():
              offset = int(post_robot_offset_path.read_text(encoding="utf-8").strip())
              monitor_bytes = monitor_path.read_bytes()
              if 0 <= offset <= len(monitor_bytes):
                  post_robot_log = monitor_bytes[offset:].decode(
                      "utf-8", errors="replace"
                  )
                  phase4c_post_robot_p4_standalone = (
                      "VERIFY:phase4c:p4_standalone:PASS" in post_robot_log
                  )
                  phase4c_post_robot_ui_8fps = (
                      "VERIFY:ui:8fps:PASS" in post_robot_log
                  )
          size_layout = {}
          if size_report_path.is_file():
              size_report = json.loads(size_report_path.read_text(encoding="utf-8"))
              size_layout = {
                  section["name"]: {
                      "total": section["total"],
                      "used": section["used"],
                      "free": section["free"],
                  }
                  for section in size_report.get("layout", [])
              }
          if sdkconfig.is_file():
              for line in sdkconfig.read_text(encoding="utf-8").splitlines():
                  if line.startswith(main_stack_prefix):
                      main_stack_size = int(line.removeprefix(main_stack_prefix))
                  elif line.startswith(agent_stack_prefix):
                      agent_stack_size = int(line.removeprefix(agent_stack_prefix))
                  elif line == agent_transport_disabled_line:
                      agent_transport_disabled = True
                  elif line.startswith(agent_transport_enabled_prefix):
                      agent_transport_disabled = (
                          line.removeprefix(agent_transport_enabled_prefix) != "y"
                      )
                  elif line.startswith(agent_protocol_version_prefix):
                      agent_protocol_version = int(
                          line.removeprefix(agent_protocol_version_prefix)
                      )
                  elif line.startswith(phase4c_validation_prefix):
                      phase4c_validation_enabled = (
                          line.removeprefix(phase4c_validation_prefix) == "y"
                      )
                  elif line.startswith(phase5a_validation_prefix):
                      phase5a_validation_enabled = (
                          line.removeprefix(phase5a_validation_prefix) == "y"
                      )
                  elif line.startswith(phase5b_validation_prefix):
                      phase5b_validation_enabled = (
                          line.removeprefix(phase5b_validation_prefix) == "y"
                      )
                  elif line.startswith(background_tasks_external_stack_prefix):
                      phase5b_background_tasks_external_stack = (
                          line.removeprefix(background_tasks_external_stack_prefix) == "y"
                      )
                  elif line.startswith(voice_transport_enabled_prefix):
                      phase5b_voice_transport_enabled = (
                          line.removeprefix(voice_transport_enabled_prefix) == "y"
                      )
                  elif line.startswith(voice_transport_stack_prefix):
                      phase5b_voice_transport_stack_size = int(
                          line.removeprefix(voice_transport_stack_prefix)
                      )
                  elif line.startswith(voice_websocket_stack_prefix):
                      phase5b_voice_websocket_stack_size = int(
                          line.removeprefix(voice_websocket_stack_prefix)
                      )
                  elif line.startswith(voice_reconnect_timeout_prefix):
                      phase5b_voice_reconnect_timeout_ms = int(
                          line.removeprefix(voice_reconnect_timeout_prefix)
                      )
                  elif line.startswith(ha_websocket_stack_prefix):
                      phase5b_ha_websocket_stack_size = int(
                          line.removeprefix(ha_websocket_stack_prefix)
                      )
                  elif line.startswith(mbedtls_external_mem_prefix):
                      phase5b_mbedtls_external_mem_alloc = (
                          line.removeprefix(mbedtls_external_mem_prefix) == "y"
                      )
                  elif line.startswith(sr_enable_prefix):
                      phase5a_sr_enabled = line.removeprefix(sr_enable_prefix) == "y"
                  elif line.startswith(audio_selftest_prefix):
                      phase5a_audio_selftest_enabled = (
                          line.removeprefix(audio_selftest_prefix) == "y"
                      )
              phase4c_agent_transport_disabled = (
                  profile in {"phase4c_ha", "phase5e_e2e", "phase5e_ui"}
                  and agent_transport_disabled
              )
              phase5a_agent_transport_disabled = (
                  profile == "phase5a_voice" and agent_transport_disabled
              )
              phase5b_agent_transport_disabled = (
                  profile in {"phase5b_voice", "phase5c_stt", "phase5e_e2e", "phase5e_ui"}
                  and agent_transport_disabled
              )
          manifest = {
              "schema_version": 1,
              "mode": "artifact-only",
              "verdict_owner": "cloud-codex",
              "git_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": "flash-and-monitor",
              "serial_port": os.environ["SERIAL_PORT"],
              "flash_baud": int(os.environ["FLASH_BAUD"]),
              "monitor_seconds": int(os.environ["MONITOR_SECONDS"]),
              "capture_seconds": int(os.environ["CAPTURE_SECONDS"]),
              "validation_profile": os.environ["VALIDATION_PROFILE"],
              "transport_exit_code": (
                  int(transport_status_path.read_text(encoding="ascii").strip())
                  if transport_status_path.is_file()
                  else None
              ),
              "transport_status": (
                  "completed"
                  if transport_status_path.is_file()
                  and transport_status_path.read_text(encoding="ascii").strip() == "0"
                  else "failed" if transport_status_path.is_file() else "unavailable"
              ),
              "log_file": "monitor.log",
              "app_image": image.name if image.is_file() else None,
              "app_size_bytes": image.stat().st_size if image.is_file() else None,
              "app_sha256": (
                  hashlib.sha256(image.read_bytes()).hexdigest()
                  if image.is_file()
                  else None
              ),
              "main_task_stack_size_bytes": main_stack_size,
              "agent_transport_task_stack_size_bytes": agent_stack_size,
              "phase4c_validation_enabled": phase4c_validation_enabled,
              "phase5a_validation_enabled": phase5a_validation_enabled,
              "phase5a_sr_enabled": phase5a_sr_enabled,
              "phase5a_audio_selftest_enabled": phase5a_audio_selftest_enabled,
              "phase5a_agent_transport_disabled": phase5a_agent_transport_disabled,
              "phase5b_validation_enabled": phase5b_validation_enabled,
              "phase5b_background_tasks_external_stack": phase5b_background_tasks_external_stack,
              "phase5b_voice_transport_enabled": phase5b_voice_transport_enabled,
              "phase5b_voice_transport_task_stack_size_bytes": phase5b_voice_transport_stack_size,
              "phase5b_voice_websocket_task_stack_size_bytes": phase5b_voice_websocket_stack_size,
              "phase5b_voice_reconnect_timeout_ms": phase5b_voice_reconnect_timeout_ms,
              "phase5b_ha_websocket_task_stack_size_bytes": phase5b_ha_websocket_stack_size,
              "phase5b_mbedtls_external_mem_alloc": phase5b_mbedtls_external_mem_alloc,
              "phase5b_agent_transport_disabled": phase5b_agent_transport_disabled,
              "product_human_mode": profile == "product_human",
              "product_human_sr_enabled": (
                  profile == "product_human" and phase5a_sr_enabled
              ),
              "product_human_voice_transport_enabled": (
                  profile == "product_human" and phase5b_voice_transport_enabled
              ),
              "product_human_agent_transport_disabled": (
                  profile == "product_human" and agent_transport_disabled
              ),
              "product_human_agent_transport_enabled": (
                  profile == "product_human" and not agent_transport_disabled
              ),
              "product_human_agent_protocol_version": (
                  agent_protocol_version if profile == "product_human" else None
              ),
              "product_human_validation_disabled": (
                  profile == "product_human"
                  and not phase5a_validation_enabled
                  and not phase5b_validation_enabled
              ),
              "product_human_audio_selftest_disabled": (
                  profile == "product_human" and not phase5a_audio_selftest_enabled
              ),
              "product_human_artifact_audit_status": (
                  product_human_audit_status_path.read_text(encoding="utf-8").strip()
                  if product_human_audit_status_path.is_file()
                  else None
              ),
              "phase5c_stt_model_revision": phase5c_model_revision,
              "phase5c_stt_model_manifest_sha256": phase5c_model_manifest_sha256,
              "phase5e_tts_model_revision": phase5e_tts_model_revision,
              "phase5e_tts_model_manifest_sha256": phase5e_tts_model_manifest_sha256,
              "phase5e_mac_speaker_driver_status": (
                  phase5e_audio_status_path.read_text(encoding="utf-8").strip()
                  if phase5e_audio_status_path.is_file()
                  else None
              ),
              "phase5e_ui_input_driver_status": (
                  phase5e_ui_input_status_path.read_text(encoding="utf-8").strip()
                  if phase5e_ui_input_status_path.is_file()
                  else None
              ),
              "phase5e_artifact_audit_status": (
                  phase5e_audit_status_path.read_text(encoding="utf-8").strip()
                  if phase5e_audit_status_path.is_file()
                  else None
              ),
              "phase5e_poweron_count": phase5e_poweron_count,
              "phase5e_reset_banner_count": phase5e_reset_banner_count,
              "phase5e_crash_marker_count": phase5e_crash_marker_count,
              "phase6h_artifact_audit_status": (
                  pathlib.Path(os.environ.get(
                      "P4HOME_PHASE6H_AUDIT_STATUS_FILE", ""
                  )).read_text(encoding="utf-8").strip()
                  if os.environ.get("P4HOME_PHASE6H_AUDIT_STATUS_FILE")
                  and pathlib.Path(os.environ[
                      "P4HOME_PHASE6H_AUDIT_STATUS_FILE"
                  ]).is_file()
                  else None
              ),
              "phase7_artifact_audit_status": (
                  phase7_audit_status_path.read_text(encoding="utf-8").strip()
                  if phase7_audit_status_path.is_file()
                  else None
              ),
              "phase4c_agent_transport_disabled": phase4c_agent_transport_disabled,
              "phase4c_policy_binding_verified": (
                  binding_status_path.is_file()
                  and binding_status_path.read_text(encoding="utf-8").strip() == "1"
              ),
              "phase4c_serial_entity_id_sanitized": (
                  sanitized_status_path.is_file()
                  and sanitized_status_path.read_text(encoding="utf-8").strip() == "1"
              ),
              "phase4c_robot_p4_offline_status": (
                  offline_status_path.read_text(encoding="utf-8").strip()
                  if offline_status_path.is_file()
                  else None
              ),
              "phase4c_robot_p4_offline_result": (
                  read_json(offline_result_path)
              ),
              "phase4c_post_robot_p4_standalone": phase4c_post_robot_p4_standalone,
              "phase4c_post_robot_ui_8fps": phase4c_post_robot_ui_8fps,
              "image_memory_layout": size_layout,
              "dependency_lock_sha256": (
                  hashlib.sha256(dependency_lock.read_bytes()).hexdigest()
                  if dependency_lock.is_file()
                  else None
              ),
              "agent_harness_status": (
                  harness_status_path.read_text(encoding="utf-8").strip()
                  if harness_status_path.is_file()
                  else None
              ),
              "agent_hardware_result": (
                  read_json(harness_result_path)
              ),
              "capture_actual_seconds": (
                  int(pathlib.Path(os.environ["P4HOME_PHASE7_CAPTURE_DURATION_FILE"])
                      .read_text(encoding="utf-8").strip())
                  if profile == "phase7_autonomy"
                  else None
              ),
          }
          pathlib.Path("firmware/hardware-validation-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Audit final Phase 5E upload candidates
        id: phase5e_final_audit
        if: always() && (inputs.validation_profile == 'phase5e_e2e' || inputs.validation_profile == 'phase5e_ui')
        run: |
          set -euo pipefail
          python3 scripts/audit-phase5e-artifacts.py \
            --repo "$GITHUB_WORKSPACE" \
            --source-archive "$P4HOME_SOURCE_ARCHIVE" \
            --artifact firmware/monitor.log \
            --artifact firmware/hardware-validation-manifest.json \
            --secret-file "$AGENT_TMP_DIR/device-token" \
            --secret-file "$AGENT_TMP_DIR/agent-key.pem" \
            --secret-file "$P4HOME_PHASE4C_TOKEN_FILE" \
            --artifact-sensitive-file "$PHASE4C_ENTITY_FILE" \
            --status-file "$P4HOME_PHASE5E_AUDIT_STATUS_FILE"
          grep -qx "pass" "$P4HOME_PHASE5E_AUDIT_STATUS_FILE"

      - name: Assert transport artifact is complete
        run: |
          set -euo pipefail
          test -s firmware/monitor.log
          test -s firmware/hardware-validation-manifest.json
          if [[ "$VALIDATION_PROFILE" == "phase5e_e2e" || \
                "$VALIDATION_PROFILE" == "phase5e_ui" ]]; then
            grep -qx "pass" "$P4HOME_PHASE5E_AUDIT_STATUS_FILE"
          fi
          if [[ "$VALIDATION_PROFILE" == "phase6h_cat_memory" ]]; then
            test -s "$AGENT_HARNESS_STATUS_FILE"
            grep -qx "pass" "$P4HOME_PHASE6H_AUDIT_STATUS_FILE"
          fi
          if [[ "$VALIDATION_PROFILE" == "phase7_autonomy" ]]; then
            test -s "$AGENT_HARNESS_STATUS_FILE"
            grep -qx "pass" "$P4HOME_PHASE7_AUDIT_STATUS_FILE"
          fi
          if [[ "$VALIDATION_PROFILE" == "product_human" ]]; then
            grep -qx "pass" "$P4HOME_PRODUCT_HUMAN_AUDIT_STATUS_FILE"
          fi

      - name: Write job summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ESP32-P4 hardware validation artifact

          The workflow transports build, flash and serial evidence only. Its job
          status is not a firmware feature verdict. Read the manifest first, then
          interpret `VERIFY:` markers in `monitor.log` for the requested behavior.
          EOF

      - name: Show monitor log tail on failure
        if: failure() && inputs.validation_profile != 'phase5e_e2e' && inputs.validation_profile != 'phase5e_ui' && inputs.validation_profile != 'phase6h_cat_memory' && inputs.validation_profile != 'phase7_autonomy'
        run: tail -n 200 firmware/monitor.log || true

      - name: Upload serial artifact
        if: >-
          always() && (
            ((inputs.validation_profile != 'phase5e_e2e' &&
              inputs.validation_profile != 'phase5e_ui' &&
              inputs.validation_profile != 'phase6h_cat_memory' &&
              inputs.validation_profile != 'phase7_autonomy' &&
              inputs.validation_profile != 'product_human') || success()) ||
            ((inputs.validation_profile == 'phase5e_e2e' ||
              inputs.validation_profile == 'phase5e_ui') &&
             steps.phase5e_final_audit.outcome == 'success')
          )
        uses: actions/upload-artifact@v4
        with:
          name: esp32-p4-monitor-log
          path: |
            firmware/monitor.log
            firmware/hardware-validation-manifest.json
          if-no-files-found: error
          retention-days: 14
